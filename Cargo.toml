[workspace]
resolver = "2"
members = [
    "core",
    "broker-paper",
    "feed-mock",
    "news-mock",
    "strategy-sma",
    "strategy-llm",
    "strategy-hybrid",
    "agent-runtime",
    "persistence",
    "trading-config",
    "licensing",
    "orchestrator",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
