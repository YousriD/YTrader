<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-labelledby="title desc">
  <title id="title">YTrader</title>
  <desc id="desc">YTrader wordmark with a simple rising market line.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <style>
      .brand { fill: #172033; }
      .mark { stroke: #172033; }
      @media (prefers-color-scheme: dark) {
        .brand { fill: #f0f6fc; }
        .mark { stroke: #f0f6fc; }
      }
    </style>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="mark" d="M22 22 50 54 78 22M50 54v44" stroke-width="12"/>
    <path d="M18 88 42 72l19 11 28-27" stroke="url(#accent)" stroke-width="6"/>
    <circle cx="89" cy="56" r="5" fill="#14b8a6" stroke="none"/>
  </g>
  <text class="brand" x="126" y="78" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="-2">Y<tspan fill="#2563eb">Trader</tspan></text>
</svg>
