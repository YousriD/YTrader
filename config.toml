mode = "test"           # "test" or "live" — live = OANDA practice ONLY (anything else refuses)
ticks = 500
tick_delay_ms = 50
news_every_n_ticks = 15
snapshot_every_n_ticks = 50  # per-agent state checkpoint; crash window = up to N ticks (0 disables)

# --- P2-4 OANDA demo template (live mode only; test mode ignores this) ---
# 1. Open a practice account, generate a token, NEVER commit it:
#      $env:OANDA_API_KEY = "your-practice-token"   # PowerShell
# 2. Uncomment, set your practice account_id, run with mode = "live".
# 3. Gate the log before trusting anything:
#      cargo run -p analytics -- gate data/run-<ts>.jsonl
# The real-money host (api-fxtrade.oanda.com) is refused mechanically —
# it cannot run, no matter what this file says.
# [oanda]
# base_url = "https://api-fxpractice.oanda.com"
# account_id = "101-001-23456789-001"

[[agents]]
id = "algo-fast"
symbol = "EUR_USD"
stake_min = 10.0
stake_max = 100.0
units = 1000.0
stop_loss_pct = 0.005    # 0.5%
take_profit_pct = 0.01   # 1.0%
strategy = { kind = "sma", fast = 5, slow = 20 }

[[agents]]
id = "algo-slow"
symbol = "EUR_USD"
stake_min = 10.0
stake_max = 100.0
units = 1000.0
stop_loss_pct = 0.005
take_profit_pct = 0.015
strategy = { kind = "sma", fast = 10, slow = 40 }

# Only spun up when ANTHROPIC_API_KEY is set (skipped otherwise).
[[agents]]
id = "llm-cautious"
symbol = "EUR_USD"
stake_min = 10.0
stake_max = 100.0
units = 1000.0
stop_loss_pct = 0.005
take_profit_pct = 0.01
strategy = { kind = "llm", persona = "Cautious mean-reversion trader, avoids overtrading.", fallback_fast = 5, fallback_slow = 20 }

